server {
 listen 8080;
 server_tokens off;
 client_max_body_size 16k;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 location /p/ { proxy_pass http://pdp:3000; proxy_set_header Host $host; }
 location /pdp-assets/ { proxy_pass http://pdp:3000/; }
 location /api/pdp/ { limit_except GET { deny all; } proxy_pass http://pdp:3000; }
 location = /health { return 200 'ok'; add_header Content-Type text/plain; }
 location / { proxy_pass http://shell:3000; proxy_set_header Host $host; }
}
